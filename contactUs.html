<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="landing page contact Us" />
    <title>contact Us</title>
  </head>
  <body>
    <header>
      <h1>Contact Us</h1>
      <p>
        Feel free to contact us any time. We will get back to you as soon as we
        can!
      </p>
    </header>
    <main>
      <form action="#" method="post">
        <div>
          <label for="name">Name</label>
          <input type="text" id="name" name="user_name" required />
        </div>

        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="user_email" required />
        </div>

        <div>
          <label for="message">Message</label>
          <textarea id="message" name="user_message" required></textarea>
        </div>

        <button type="submit">SEND</button>
      </form>

      <aside>
        <h2>Info</h2>
        <ul>
          <li>
            <strong>Email:</strong>
            <a href="">info@getintouch.we</a>
          </li>
          <li>
            <strong>Phone:</strong>
            <a href="">+24 56 89 146</a>
          </li>
          <li>
            <strong>Address:</strong>
            <p>14 Greenlod st .</p>
          </li>
          <li>
            <strong>Working Hours:</strong>
            <time datetime="09:00">09:00</time> -
            <time datetime="18:00">18:00</time>
          </li>
        </ul>
      </aside>
    </main>

    <footer>
      <nav>
        <ul>
          <li><a href="#">Facebook</a></li>
          <li><a href="#">Instagram</a></li>
          <li><a href="#">Twitter</a></li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
